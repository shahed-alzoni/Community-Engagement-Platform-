<!doctype html>
<html lang="en">
  <body style="margin:0;background:#edf7fb;font-family:Arial,sans-serif;color:#07164f">
    <div style="max-width:560px;margin:30px auto;padding:34px;background:#fff;border-radius:18px">
      <h1 style="margin-top:0">Reset your Qarib password</h1>
      <p>Hello {{ user.full_name }},</p>
      <p>We received a request to reset your Qarib password.</p>
      <p style="margin:28px 0">
        <a href="{{ reset_url }}" style="padding:14px 22px;color:#fff;background:#087b9c;border-radius:10px;text-decoration:none;font-weight:bold">Choose a new password</a>
      </p>
      <p>This link expires in {{ timeout_minutes }} minutes.</p>
      <p>If you did not request this change, you can safely ignore this email.</p>
      <p>Qarib Support</p>
    </div>
  </body>
</html>
